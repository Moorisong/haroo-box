name: i18n checks
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
jobs:
  translations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm ci --prefix apps/server
      - run: npm run build --prefix apps/server
